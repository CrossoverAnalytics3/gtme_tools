<!doctype html>
<html>
<head><meta charset="utf-8"><title>BarChart preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></head>
<body>
<div id="root" data-tool="agent-roi" style="padding:16px;background:var(--page);"></div>
<script>
  var K = window.GTMKit, root = document.getElementById('root');
  root.className = 'card';
  root.append(K.BarChart({ rows: [
    { label: 'Before: SDR team', value: 950000, display: '$950,000', muted: true },
    { label: 'After: QA SDR(s)', value: 95000, display: '$95,000' },
    { label: 'After: GTME upkeep', value: 55000, display: '$55,000' },
    { label: 'After: compute', value: 1080, display: '$1,080' }
  ] }));
</script>
</body>
</html>
